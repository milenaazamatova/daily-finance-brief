# Runs the Daily Finance Brief pipeline every morning and commits the day's log file.
name: Daily brief

on:
  schedule:
    # 03:00 UTC = 07:00 Dubai (UTC+4, no daylight saving). GitHub may start scheduled runs a little late.
    - cron: "0 3 * * *"
  # Adds a "Run workflow" button on the Actions tab for manual test runs.
  workflow_dispatch:
    inputs:
      force:
        description: "Replace today's brief if it already exists"
        type: boolean
        default: false

# Needed so the workflow can commit the daily log back to the repository.
permissions:
  contents: write

# Never run two briefs at the same time (e.g. a manual run overlapping the scheduled one).
concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    # Safety net: the pipeline normally takes 2-10 minutes; stop anything stuck well before GitHub's 6-hour limit.
    timeout-minutes: 45
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install libraries
        run: pip install -r pipeline/requirements.txt

      - name: Run the pipeline
        working-directory: pipeline
        # Secrets are injected as environment variables; GitHub masks their values in the logs.
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          GEMINI_FALLBACK_MODEL: ${{ secrets.GEMINI_FALLBACK_MODEL }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -u main.py ${{ inputs.force && '--force' || '' }}

      # Runs even if the pipeline failed, so failed days are logged too.
      # Regular commits also keep the schedule alive: GitHub pauses schedules in repos with no activity for 60 days.
      - name: Commit the daily log
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logs/
          if git diff --cached --quiet; then
            echo "No log changes to commit."
          else
            git commit -m "Daily log $(date -u +%F)"
            git pull --rebase
            git push
          fi
