    section: Speeches
    enabled: true
  - name: CNBC (Finance)
    url: https://www.cnbc.com/id/10000664/device/rss/rss.html
    region: us
    section: Finance
    enabled: true
  - name: CNBC (Business)
    url: https://www.cnbc.com/id/10001147/device/rss/rss.html
