# News sources for the daily brief.
# Rule: business / markets / economy / finance SECTION feeds only, never an outlet's main or all-news feed.
# Each feed is labelled with:
#   region:  where the feed's coverage is focused (uae | us | china | russia | global).
#            Gemini still decides each STORY's region from its content; this label is for you.
#   section: which section of the outlet the feed comes from.
# To add a source: copy a block and change it. To pause one: set enabled: false.
# All URLs were tested on 2026-09-26/27 (HTTP 200, valid feed, links really come from that section).
#
# "via Google News" = the outlet has no working section feed of its own, so this is a Google News
# search limited to that outlet's section pages. Links go via news.google.com and redirect to the original.
# "search" = a Google News keyword search limited to reputable business outlets (Reuters, FT, Bloomberg),
# used where no country-specific business feed exists.

# Items whose title matches any of these (regular expressions) are skipped: they are stock-quote
# pages that Google News returns for Reuters searches, not news articles.
skip_titles:
  - "Stock Price & Latest News"
  - "^About .+\\([A-Z0-9.]+\\)"

rss:
  # ===================== UAE =====================
  - name: The National (Business)
    url: https://www.thenationalnews.com/arc/outboundfeeds/rss/category/business/?outputType=xml
    region: uae
    section: Business
    enabled: true
  - name: Gulf News (Business)
    url: https://gulfnews.com/api/v1/collections/business.rss
    region: uae
    section: Business
    enabled: true
  - name: Khaleej Times (Business)
    url: https://www.khaleejtimes.com/api/v1/collections/business.rss
    region: uae
    section: Business
    enabled: true
  # Arabian Business section feeds return 403 and ?category= is ignored by their server.
  - name: Arabian Business (Business, via Google News)
    url: https://news.google.com/rss/search?q=site:arabianbusiness.com/business+when:1d&hl=en-AE&gl=AE&ceid=AE:en
    region: uae
    section: Business
    enabled: true
  # Zawya has no RSS feeds. Google indexes it slowly, so expect only a few articles a day.
  - name: Zawya (Business, via Google News)
    url: https://news.google.com/rss/search?q=site:zawya.com/en/business+when:1d&hl=en-AE&gl=AE&ceid=AE:en
    region: uae
    section: Business
    enabled: true
  - name: Zawya (Economy, via Google News)
    url: https://news.google.com/rss/search?q=site:zawya.com/en/economy+when:1d&hl=en-AE&gl=AE&ceid=AE:en
    region: uae
    section: Economy
    enabled: true
  # Central Bank of the UAE: no public RSS (every URL returns 403). Covered via the UAE outlets above.

