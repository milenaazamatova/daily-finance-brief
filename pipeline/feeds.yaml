  # ===================== China =====================
  # People's Bank of China: no public RSS feed. Its news arrives via the China search and SCMP below.
  - name: South China Morning Post (Business)
    url: https://www.scmp.com/rss/92/feed
    region: china
    section: Business
    enabled: true
  - name: South China Morning Post (China Economy)
    url: https://www.scmp.com/rss/318421/feed
    region: china
    section: China economy
    enabled: true
  - name: South China Morning Post (Companies)
    url: https://www.scmp.com/rss/10/feed
    region: china
    section: Companies
    enabled: true
  - name: China economy (search - Reuters, FT, Bloomberg)
    url: https://news.google.com/rss/search?q=China+(economy+OR+yuan+OR+PBOC+OR+stocks)+(site:reuters.com+OR+site:ft.com+OR+site:bloomberg.com)+when:1d&hl=en-US&gl=US&ceid=US:en
    region: china
    section: Search - China economy, yuan, PBOC, stocks
    enabled: true
  # STATE-AFFILIATED (China Global Television Network, owned by the Chinese state). Off by default:
  # its business section is mostly commentary. Set enabled: true to include the official perspective.
  - name: CGTN (Business) [state-affiliated]
    url: https://www.cgtn.com/subscribe/rss/section/business.xml
    region: china
    section: Business
    state_affiliated: true
    enabled: false

  # ===================== Russia =====================
  # The Bell is an independent Russian business publication that only covers business and the economy,
  # so its single feed is effectively a business-section feed.
  - name: The Bell
    url: https://en.thebell.io/rss/
    region: russia
    section: Business & economy (business-only outlet)
    enabled: true
  - name: bne IntelliNews (Russia, via Google News)
    url: https://news.google.com/rss/search?q=site:intellinews.com+Russia+when:1d&hl=en-US&gl=US&ceid=US:en
    region: russia
    section: Russia
    enabled: true
  - name: Russia economy (search - Reuters, FT, Bloomberg)
    url: https://news.google.com/rss/search?q=Russia+(economy+OR+ruble+OR+%22central+bank%22+OR+oil)+(site:reuters.com+OR+site:ft.com+OR+site:bloomberg.com)+when:1d&hl=en-US&gl=US&ceid=US:en
    region: russia
    section: Search - Russia economy, ruble, central bank, oil
    enabled: true
  # Official central bank feed. Russian language only (no English feed exists); Gemini reads Russian.
  - name: Bank of Russia (Events & press releases, in Russian)
    url: https://www.cbr.ru/rss/eventrss
    region: russia
    section: Events & press releases
    enabled: true
  # TASS (state-affiliated) is not used: it only offers its main all-news feed.

